# =============================================================================
# Copy to 01-secrets.yaml, fill in, apply, and do NOT commit the copy.
# .gitignore already excludes k8s/01-secrets.yaml.
#
#   AUTH_SECRET:  openssl rand -base64 48
#   Google:       the OAuth client for learn.pulplabs.ai
#
# AUTH_SECRET is not optional here. Left empty the service generates one and
# stores it in the database — which two replicas cannot agree on, so a request
# would be signed by one pod and rejected by the other.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: learn-secrets
  namespace: pulplabs-learn
type: Opaque
stringData:
  AUTH_SECRET: ''
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  POSTGRES_PASSWORD: ''
  # Assembled from the values above; keep the password identical.
  DATABASE_URL: 'postgres://learn:CHANGE_ME@learn-postgres:5432/learn'
