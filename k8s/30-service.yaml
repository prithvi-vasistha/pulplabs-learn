# =============================================================================
# The content service.
#
# The only process that opens a database connection, and the only one that
# reads an exam answer key or a password hash. It has no Ingress: nothing
# outside the cluster should be able to reach it.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: learn-service
  namespace: pulplabs-learn
  labels:
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: pulplabs-learn
spec:
  selector:
    app.kubernetes.io/name: service
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learn-service
  namespace: pulplabs-learn
  labels:
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: pulplabs-learn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service
        app.kubernetes.io/part-of: pulplabs-learn
    spec:
      containers:
        - name: service
          image: ghcr.io/prithvi-vasistha/pulplabs-learn-service:latest
          ports:
            - name: http
              containerPort: 4000
          env:
            # The Job owns both. A replica that also ran them would race its
            # own siblings on every rollout.
            - name: SKIP_SCHEMA
              value: '1'
            - name: SKIP_SEED
              value: '1'
            - name: PORT
              value: '4000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: learn-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: learn-secrets
                  key: AUTH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: learn-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: learn-secrets
                  key: GOOGLE_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
