apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learn-service
  namespace: pulplabs-learn
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 15
        type: Pods
        value: 4
      - periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 0
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learn-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learn-web
  namespace: pulplabs-learn
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 15
        type: Pods
        value: 4
      - periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 0
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learn-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learn-service
  namespace: pulplabs-learn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learn-web
  namespace: pulplabs-learn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
